<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>My Bank Transaction Viewer</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <!--
    Week 4 starter. Run it with:   python tools/serve.py my-work/viewer
    The three sections below (summary, transactions, review-queue) are the
    viewer contract: keep their ids, the week 4 check looks for them.
    Look at the mockups in docs/mockups/ for what we are aiming at.
  -->
  <header class="titlebar">My Bank Transaction Viewer</header>
  <nav class="tabs">
    <button data-view="summary">Summary</button>
    <button data-view="transactions">Transactions</button>
    <button data-view="review-queue">Review queue <span id="review-count">0</span></button>
  </nav>

  <main>
    <p id="status">Loading transactions.json</p>

    <section id="summary" class="view">
      <h1>Summary</h1>
      <select id="month-select" aria-label="Month"></select>
      <div id="cards"></div>
      <h2>Spending by category</h2>
      <div id="category-bars"></div>
    </section>

    <section id="transactions" class="view" hidden>
      <h1>Transactions</h1>
      <table>
        <thead><tr><th>Date</th><th>Description</th><th>Account</th><th>Amount</th><th>Category</th><th>Decided by</th></tr></thead>
        <tbody id="ledger-body"></tbody>
      </table>
    </section>

    <section id="review-queue" class="view" hidden>
      <h1>Review queue</h1>
      <div id="review-cards"></div>
    </section>
  </main>
  <p class="sample">Sample data: fictional banks and people</p>

  <script src="app.js"></script>
</body>
</html>

# Reference CD workflow for a STUDENT copy of this repo. Peek only after your agent wrote yours.
# Lives in your repo at .github/workflows/deploy.yml.
#
# What it does: when you push a tag like v1.0.0, it runs the full pipeline, builds _site/
# (your viewer plus your transactions.json) and publishes it with GitHub Pages.
# One time setup: Settings > Pages > Source: GitHub Actions.

name: deploy viewer

on:
  push:
    tags: ["v*"]
  workflow_dispatch:      # also lets you press "Run workflow" by hand

permissions:
  contents: read
  pages: write            # needed to publish to Pages
  id-token: write         # proves to Pages that this run is really from your repo

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Test first, then build _site/ (never deploy a red build)
        run: python tools/ci_local.py --week 4
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4

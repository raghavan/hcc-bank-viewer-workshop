# Reference CI workflow for a STUDENT copy of this repo. Peek only after your agent wrote yours.
# Lives in your repo at .github/workflows/checks.yml (not in reference/).
#
# What it does: on every push and pull request, a fresh Linux machine checks out your code,
# installs Java 21 and runs the same tests you run at home. Red means a test failed.
# It only ever sees the mock data: your own bank files are in data/private/, which git ignores.

name: checks

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read          # this job only reads your code

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 10   # a stuck run stops instead of using up minutes
    env:
      WEEK: "4"           # change this each week
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven     # reuses downloaded libraries, so later runs are faster
      - name: The weekly tests, exactly as you run them at home
        run: ./mvnw -B test -Dweek="$WEEK"
      - name: Keep the test report so you can download it from the run page
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-report
          path: target/starter/surefire-reports
          if-no-files-found: ignore

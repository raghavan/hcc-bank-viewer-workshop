# Instructor self test for THIS repo. Student copies skip it (see the if: line),
# so students spend their Actions minutes only on the workflows they write themselves.
name: selftest

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  selftest:
    if: github.repository == 'raghavan/hcc-bank-viewer-workshop' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - run: python tools/selftest.py

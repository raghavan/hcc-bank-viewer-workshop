# A bank profile: tells Readers.fromProfile how to read one bank's CSV export.
# This one reads the FAKE Seagrape Bank file next to it.
#
# To read your own bank: copy this file into data/private/, rename it (mybank.properties),
# put your export next to it, and change the settings below to match your file.
# Open your export in a text editor first, not a spreadsheet, so you see it as it really is.

# Lowercase letters only. Your ids become mybank-1, mybank-2, ...
bank_id=seagrape
# A name for the account. It stays on your computer and is never sent to the AI.
account_name=Seagrape Everyday Checking
# The export file, in the same folder as this profile
file=seagrape_export.csv
# Lines to skip BEFORE the header line (blank lines and lines starting with # skip themselves)
skip_lines=1

date_column=Posted Date
# A Java date pattern: MM/dd/yyyy for 04/01/2027, M/d/yy for 4/1/27, yyyy-MM-dd for 2027-04-01,
# MMM d, yyyy for Apr 1, 2027. Times are fine too: yyyy-MM-dd'T'HH:mm:ss
date_format=MM-dd-yyyy
description_column=Payee

# EITHER two columns, one for money out and one for money in:
debit_column=Withdrawal
credit_column=Deposit
# OR one signed column (delete the two lines above and use these instead):
# amount_column=Amount
# sign=normal     normal: negative means money out (most bank accounts)
#                 flipped: positive means money out (most credit card exports)
